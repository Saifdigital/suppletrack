<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuppleTrack</title>
  <meta name="description" content="Your personal supplement tracker" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --card: #1e2335;
      --border: #2a3050;
      --accent: #4fffb0;
      --accent2: #7b61ff;
      --warn: #ff7043;
      --text: #e8eaf6;
      --muted: #7986a3;
      --danger: #ff4f6a;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 100px;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79,255,176,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79,255,176,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 20px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }

    .date-badge {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
    }

    /* Summary strip */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 12px;
      text-align: center;
    }

    .summary-card .val {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .summary-card .label {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Section title */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Add button */
    .btn-add {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-add:hover { opacity: 0.85; }

    /* Supplement cards */
    .supplement-list { display: flex; flex-direction: column; gap: 12px; }

    .supplement-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: border-color 0.2s;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .supplement-card.warning { border-color: var(--warn); }
    .supplement-card.rest { border-color: var(--accent2); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .supp-name {
      font-family: 'Syne', sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .supp-dose {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-active { background: rgba(79,255,176,0.15); color: var(--accent); }
    .badge-rest { background: rgba(123,97,255,0.15); color: var(--accent2); }
    .badge-low { background: rgba(255,112,67,0.15); color: var(--warn); }

    /* Serving control */
    .serving-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .serving-label { font-size: 13px; color: var(--muted); flex: 1; }

    .serving-ctrl {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .serving-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .serving-btn:hover { background: rgba(79,255,176,0.1); }

    .serving-count {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      min-width: 32px;
      text-align: center;
    }

    /* Progress bars */
    .progress-row { margin-bottom: 10px; }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .progress-bar {
      height: 6px;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .fill-cycle { background: linear-gradient(90deg, var(--accent), #00e5ff); }
    .fill-refill { background: linear-gradient(90deg, var(--warn), #ffcc02); }

    /* Card actions */
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .btn-action {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); }
    .btn-action.danger:hover { border-color: var(--danger); color: var(--danger); }

    .btn-taken {
      background: rgba(79,255,176,0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus { border-color: var(--accent); }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .btn-secondary {
      flex: 1;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover { border-color: var(--accent); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(24,28,39,0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 20px;
      z-index: 50;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.2s;
      padding: 4px 20px;
    }

    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #000;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 200;
      animation: toastIn 0.3s ease;
      white-space: nowrap;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Rest period overlay */
    .rest-overlay {
      background: rgba(123,97,255,0.08);
      border: 1px dashed var(--accent2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* History tab */
    .history-entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
    .history-detail { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .history-time { font-size: 12px; color: var(--muted); text-align: right; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 14px; }

    select option { background: var(--card); }

    .reminder-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--accent2);
      background: rgba(123,97,255,0.12);
      border: 1px solid rgba(123,97,255,0.25);
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Supple<span>Track</span></div>
    <div class="date-badge" id="dateBadge"></div>
  </header>

  <!-- Summary strip -->
  <div class="summary">
    <div class="summary-card">
      <div class="val" id="totalSupps">0</div>
      <div class="label">Supplements</div>
    </div>
    <div class="summary-card">
      <div class="val" id="takenToday">0</div>
      <div class="label">Taken Today</div>
    </div>
    <div class="summary-card">
      <div class="val" id="refillSoon" style="color:var(--warn)">0</div>
      <div class="label">Refill Soon</div>
    </div>
  </div>

  <!-- Main content -->
  <div id="mainContent"></div>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="navToday" onclick="switchTab('today')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>
    Today
  </button>
  <button class="nav-btn" id="navHistory" onclick="switchTab('history')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    History
  </button>
  <button class="nav-btn" id="navSettings" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    Settings
  </button>
</nav>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add Supplement</div>
    <div class="field">
      <label>Supplement Name</label>
      <input type="text" id="inputName" placeholder="e.g. Vitamin D3" />
    </div>
    <div class="field">
      <label>Dosage</label>
      <input type="text" id="inputDose" placeholder="e.g. 1000mg" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Servings / Day</label>
        <input type="number" id="inputServings" value="1" min="1" max="10" />
      </div>
      <div class="field">
        <label>Total Pills</label>
        <input type="number" id="inputTotal" value="60" min="1" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Cycle Days</label>
        <input type="number" id="inputCycle" value="0" min="0" placeholder="0 = no cycle" />
      </div>
      <div class="field">
        <label>Rest Days</label>
        <input type="number" id="inputRest" value="0" min="0" placeholder="0 = no rest" />
      </div>
    </div>
    <div class="field">
      <label>Refill Alert (pills left)</label>
      <input type="number" id="inputRefill" value="10" min="1" />
    </div>
    <div class="field">
      <label>🔔 Daily Reminder Time (optional)</label>
      <input type="time" id="inputReminder" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveSupp()">Save</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer"></div>

<script>
  // ── State ──────────────────────────────────────────────
  let supplements = [];
  let history = [];
  let editingId = null;
  let currentTab = 'today';

  const today = () => new Date().toDateString();

  // ── Storage ────────────────────────────────────────────
  function save() {
    localStorage.setItem('suppletrack_supps', JSON.stringify(supplements));
    localStorage.setItem('suppletrack_history', JSON.stringify(history));
  }

  function load() {
    try {
      supplements = JSON.parse(localStorage.getItem('suppletrack_supps')) || [];
      history = JSON.parse(localStorage.getItem('suppletrack_history')) || [];
    } catch(e) {
      supplements = []; history = [];
    }
  }

  // ── Date badge ─────────────────────────────────────────
  function updateDateBadge() {
    const d = new Date();
    document.getElementById('dateBadge').textContent =
      d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }

  // ── Summary ────────────────────────────────────────────
  function updateSummary() {
    const active = supplements.filter(s => !isInRest(s));
    const takenCount = supplements.filter(s => s.takenDates && s.takenDates[today()] >= s.servings).length;
    const refillCount = supplements.filter(s => s.pillsLeft <= s.refillAlert).length;
    document.getElementById('totalSupps').textContent = supplements.length;
    document.getElementById('takenToday').textContent = takenCount;
    document.getElementById('refillSoon').textContent = refillCount;
  }

  // ── Cycle helpers ──────────────────────────────────────
  function isInRest(s) {
    if (!s.cycleStart || !s.cycleDays || !s.restDays) return false;
    const start = new Date(s.cycleStart);
    const diff = Math.floor((Date.now() - start) / 86400000);
    const period = s.cycleDays + s.restDays;
    return (diff % period) >= s.cycleDays;
  }

  function cycleDay(s) {
    if (!s.cycleStart || !s.cycleDays) return null;
    const diff = Math.floor((Date.now() - new Date(s.cycleStart)) / 86400000);
    const period = s.cycleDays + (s.restDays || 0);
    return (diff % period) + 1;
  }

  function daysLeftInPhase(s) {
    if (!s.cycleStart || !s.cycleDays) return null;
    const diff = Math.floor((Date.now() - new Date(s.cycleStart)) / 86400000);
    const period = s.cycleDays + (s.restDays || 0);
    const dayInPeriod = diff % period;
    if (dayInPeriod < s.cycleDays) return s.cycleDays - dayInPeriod;
    return (s.cycleDays + s.restDays) - dayInPeriod;
  }

  // ── Render today ────────────────────────────────────────
  function renderToday() {
    const cont = document.getElementById('mainContent');
    let html = `
      <div class="section-header">
        <span class="section-title">My Supplements</span>
        <button class="btn-add" onclick="openModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
          Add
        </button>
      </div>
      <div class="supplement-list">
    `;

    if (supplements.length === 0) {
      html += `<div class="empty-state"><div class="icon">💊</div><p>No supplements yet.<br>Tap Add to get started!</p></div>`;
    }

    supplements.forEach(s => {
      const inRest = isInRest(s);
      const takenToday = (s.takenDates && s.takenDates[today()]) || 0;
      const fullyTaken = takenToday >= s.servings;
      const lowPills = s.pillsLeft <= s.refillAlert;
      const cycleProgress = s.cycleDays ? Math.min(100, ((cycleDay(s)-1) / s.cycleDays) * 100) : 0;
      const refillProgress = Math.min(100, (s.pillsLeft / s.totalPills) * 100);
      const cardClass = lowPills ? 'warning' : inRest ? 'rest' : '';

      html += `<div class="supplement-card ${cardClass}">
        <div class="card-top">
          <div>
            <div class="supp-name">${s.name}</div>
            <div class="supp-dose">${s.dose} · ${s.servings}x/day</div>
          </div>
          <span class="badge ${inRest ? 'badge-rest' : lowPills ? 'badge-low' : 'badge-active'}">
            ${inRest ? '😴 Rest' : lowPills ? '⚠️ Low' : '✅ Active'}
          </span>
        </div>
        ${s.reminderTime ? '<div class="reminder-tag">🔔 ' + formatTime(s.reminderTime) + '</div>' : ''}
      `;

      if (inRest) {
        html += `<div class="rest-overlay">🌙 Rest period · ${daysLeftInPhase(s)} day(s) left</div>`;
      } else {
        html += `
        <div class="serving-row">
          <span class="serving-label">Taken today</span>
          <div class="serving-ctrl">
            <button class="serving-btn" onclick="adjustServing('${s.id}', -1)">−</button>
            <span class="serving-count">${takenToday}/${s.servings}</span>
            <button class="serving-btn" onclick="adjustServing('${s.id}', 1)">+</button>
          </div>
        </div>`;
      }

      if (s.cycleDays) {
        html += `
        <div class="progress-row">
          <div class="progress-labels">
            <span>Cycle Day ${cycleDay(s)}/${s.cycleDays}</span>
            <span>${daysLeftInPhase(s)}d left</span>
          </div>
          <div class="progress-bar"><div class="progress-fill fill-cycle" style="width:${cycleProgress}%"></div></div>
        </div>`;
      }

      html += `
      <div class="progress-row">
        <div class="progress-labels">
          <span>Pills Remaining</span>
          <span>${s.pillsLeft} / ${s.totalPills}</span>
        </div>
        <div class="progress-bar"><div class="progress-fill fill-refill" style="width:${refillProgress}%"></div></div>
      </div>
      <div class="card-actions">
        ${!inRest ? `<button class="btn-action ${fullyTaken ? 'btn-taken' : ''}" onclick="markTaken('${s.id}')">
          ${fullyTaken ? '✅ Done' : '💊 Mark Taken'}
        </button>` : ''}
        <button class="btn-action" onclick="refillSupp('${s.id}')">🔄 Refill</button>
        <button class="btn-action" onclick="openEdit('${s.id}')">✏️ Edit</button>
        <button class="btn-action danger" onclick="deleteSupp('${s.id}')">🗑️</button>
      </div>
      </div>`;
    });

    html += '</div>';
    cont.innerHTML = html;
    updateSummary();
  }

  // ── Render history ──────────────────────────────────────
  function renderHistory() {
    const cont = document.getElementById('mainContent');
    let html = `<div class="section-header"><span class="section-title">History</span></div>`;
    if (history.length === 0) {
      html += `<div class="empty-state"><div class="icon">📋</div><p>No history yet.<br>Take your first supplement!</p></div>`;
    } else {
      const sorted = [...history].reverse();
      sorted.forEach(h => {
        html += `<div class="history-entry">
          <div>
            <div class="history-name">${h.name}</div>
            <div class="history-detail">${h.dose} · ${h.count} serving(s)</div>
          </div>
          <div class="history-time">${h.date}<br>${h.time}</div>
        </div>`;
      });
    }
    cont.innerHTML = html;
  }

  function renderSettings() {
    const cont = document.getElementById('mainContent');
    const notifStatus = !('Notification' in window) ? '❌ Not supported' :
      Notification.permission === 'granted' ? '✅ Enabled' :
      Notification.permission === 'denied' ? '🚫 Blocked' : '⏳ Not yet enabled';

    const reminderList = supplements.filter(s => s.reminderTime).map(s =>
      `<div class="history-entry" style="margin-bottom:8px">
        <div><div class="history-name">${s.name}</div><div class="history-detail">${s.dose}</div></div>
        <div class="history-time">🔔 ${formatTime(s.reminderTime)}</div>
      </div>`
    ).join('') || `<p style="font-size:13px;color:var(--muted)">No reminders set. Edit a supplement to add a reminder time.</p>`;

    cont.innerHTML = `
      <div class="section-header"><span class="section-title">Settings</span></div>
      <div class="supplement-card">
        <div class="supp-name" style="margin-bottom:4px">🔔 Notifications</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Status: ${notifStatus}</div>
        <button class="btn-primary" onclick="requestNotif()" style="width:100%">
          ${Notification.permission === 'granted' ? 'Notifications Active ✅' : 'Enable Notifications'}
        </button>
      </div>
      <div class="supplement-card" style="margin-top:12px">
        <div class="supp-name" style="margin-bottom:12px">⏰ Scheduled Reminders</div>
        ${reminderList}
      </div>
      <div class="supplement-card" style="margin-top:12px">
        <div class="supp-name" style="margin-bottom:8px">🗑️ Reset All Data</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Delete all supplements and history. This cannot be undone.</p>
        <button class="btn-action danger" style="width:100%;padding:12px" onclick="resetAll()">Reset Everything</button>
      </div>
      <div class="supplement-card" style="margin-top:12px;text-align:center">
        <div style="font-size:12px;color:var(--muted)">SuppleTrack v1.1 · Built with ❤️</div>
      </div>
    `;
  }

  // ── Tab switch ─────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('nav' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    if (tab === 'today') renderToday();
    else if (tab === 'history') renderHistory();
    else renderSettings();
  }

  // ── Actions ─────────────────────────────────────────────
  function adjustServing(id, delta) {
    const s = supplements.find(x => x.id === id);
    if (!s) return;
    if (!s.takenDates) s.takenDates = {};
    const cur = s.takenDates[today()] || 0;
    const next = Math.max(0, Math.min(s.servings, cur + delta));
    if (next === cur) return;
    const diff = next - cur;
    s.takenDates[today()] = next;
    if (diff > 0) s.pillsLeft = Math.max(0, s.pillsLeft - diff);
    save(); renderToday();
  }

  function markTaken(id) {
    const s = supplements.find(x => x.id === id);
    if (!s) return;
    if (!s.takenDates) s.takenDates = {};
    const cur = s.takenDates[today()] || 0;
    if (cur >= s.servings) { toast('Already taken for today! ✅'); return; }
    const toTake = s.servings - cur;
    s.takenDates[today()] = s.servings;
    s.pillsLeft = Math.max(0, s.pillsLeft - toTake);
    history.push({
      name: s.name, dose: s.dose, count: toTake,
      date: new Date().toLocaleDateString(),
      time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
    });
    if (s.pillsLeft <= s.refillAlert) toast(`⚠️ ${s.name} running low — refill soon!`);
    else toast(`💊 ${s.name} marked as taken!`);
    save(); renderToday();
  }

  function refillSupp(id) {
    const s = supplements.find(x => x.id === id);
    if (!s) return;
    s.pillsLeft = s.totalPills;
    toast(`🔄 ${s.name} refilled!`);
    save(); renderToday();
  }

  function deleteSupp(id) {
    if (!confirm('Delete this supplement?')) return;
    supplements = supplements.filter(x => x.id !== id);
    save(); renderToday();
  }

  function resetAll() {
    if (!confirm('Delete ALL data? This cannot be undone.')) return;
    supplements = []; history = [];
    save(); renderToday();
    toast('All data cleared.');
  }

  function requestNotif() {
    if (!('Notification' in window)) { toast('Notifications not supported'); return; }
    Notification.requestPermission().then(p => {
      if (p === 'granted') { toast('🔔 Notifications enabled!'); scheduleAllReminders(); }
      else toast('Notifications blocked — please allow in browser settings.');
    });
  }

  // ── Reminder system ────────────────────────────────────
  const reminderTimers = {};

  function formatTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  function msUntil(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    const now = new Date();
    const target = new Date();
    target.setHours(h, m, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
    return target - now;
  }

  function fireReminder(s) {
    if (Notification.permission !== 'granted') return;
    const takenToday = (s.takenDates && s.takenDates[today()]) || 0;
    if (takenToday >= s.servings) return; // already taken
    if (isInRest(s)) return; // in rest period
    new Notification(`💊 ${s.name} — ${s.dose}`, {
      body: `Time to take your ${s.name}! (${takenToday}/${s.servings} taken today)`,
      icon: 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple/img/apple/64/1f48a.png',
      badge: 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple/img/apple/64/1f48a.png',
      tag: `suppletrack-${s.id}`,
    });
  }

  function scheduleReminder(s) {
    if (!s.reminderTime) return;
    if (reminderTimers[s.id]) { clearTimeout(reminderTimers[s.id]); clearInterval(reminderTimers[s.id + '_int']); }
    const delay = msUntil(s.reminderTime);
    reminderTimers[s.id] = setTimeout(() => {
      fireReminder(s);
      // repeat every 24h
      reminderTimers[s.id + '_int'] = setInterval(() => fireReminder(s), 86400000);
    }, delay);
  }

  function scheduleAllReminders() {
    if (Notification.permission !== 'granted') return;
    supplements.forEach(s => scheduleReminder(s));
  }

  // ── Modal ──────────────────────────────────────────────
  function openModal() {
    editingId = null;
    document.getElementById('modalTitle').textContent = 'Add Supplement';
    document.getElementById('inputName').value = '';
    document.getElementById('inputDose').value = '';
    document.getElementById('inputServings').value = 1;
    document.getElementById('inputTotal').value = 60;
    document.getElementById('inputCycle').value = 0;
    document.getElementById('inputRest').value = 0;
    document.getElementById('inputRefill').value = 10;
    document.getElementById('inputReminder').value = '';
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function openEdit(id) {
    const s = supplements.find(x => x.id === id);
    if (!s) return;
    editingId = id;
    document.getElementById('modalTitle').textContent = 'Edit Supplement';
    document.getElementById('inputName').value = s.name;
    document.getElementById('inputDose').value = s.dose;
    document.getElementById('inputServings').value = s.servings;
    document.getElementById('inputTotal').value = s.totalPills;
    document.getElementById('inputCycle').value = s.cycleDays || 0;
    document.getElementById('inputRest').value = s.restDays || 0;
    document.getElementById('inputRefill').value = s.refillAlert;
    document.getElementById('inputReminder').value = s.reminderTime || '';
    document.getElementById('modalOverlay').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modalOverlay').style.display = 'none';
  }

  function saveSupp() {
    const name = document.getElementById('inputName').value.trim();
    const dose = document.getElementById('inputDose').value.trim();
    const servings = parseInt(document.getElementById('inputServings').value) || 1;
    const totalPills = parseInt(document.getElementById('inputTotal').value) || 60;
    const cycleDays = parseInt(document.getElementById('inputCycle').value) || 0;
    const restDays = parseInt(document.getElementById('inputRest').value) || 0;
    const refillAlert = parseInt(document.getElementById('inputRefill').value) || 10;
    const reminderTime = document.getElementById('inputReminder').value || null;
    if (!name) { alert('Please enter a supplement name.'); return; }

    if (editingId) {
      const s = supplements.find(x => x.id === editingId);
      Object.assign(s, { name, dose, servings, totalPills, cycleDays, restDays, refillAlert, reminderTime });
    } else {
      supplements.push({
        id: Date.now().toString(),
        name, dose, servings, totalPills,
        pillsLeft: totalPills,
        cycleDays, restDays, refillAlert, reminderTime,
        cycleStart: cycleDays ? new Date().toISOString() : null,
        takenDates: {}
      });
    }

    closeModal();
    save();
    scheduleAllReminders();
    renderToday();
    toast(editingId ? '✅ Supplement updated!' : '💊 Supplement added!');
  }

  // ── Toast ──────────────────────────────────────────────
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // ── Init ───────────────────────────────────────────────
  load();
  updateDateBadge();
  renderToday();
  scheduleAllReminders();

  // Auto-reset taken count daily
  setInterval(() => {
    updateDateBadge();
    if (currentTab === 'today') renderToday();
  }, 60000);
</script>
</body>
</html>
